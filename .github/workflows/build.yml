name: Update site data

on:
  schedule:
    - cron: "*/15 * * * *"   # project data, every 15 minutes
    - cron: "17 10 * * *"    # diagrams too, once a day (about 6:17 AM Eastern)
  workflow_dispatch:
    inputs:
      diagrams:
        description: "Refresh the diagrams too"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the feed and encrypt it
        run: node tools/build.mjs
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          FEED_URL: ${{ secrets.FEED_URL }}
          REFRESH_DIAGRAMS: ${{ github.event.schedule == '17 10 * * *' || inputs.diagrams == true }}
      - name: Publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update encrypted site data"
            git push
          fi
