name: Update site data

on:
  schedule:
    - cron: "*/15 * * * *"   # project data and document copies, every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read the feed and encrypt it
        run: node tools/build.mjs
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          FEED_URL: ${{ secrets.FEED_URL }}
      - name: Publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update encrypted site data"
            git push
          fi
