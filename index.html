<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08142B">
<title>POA · Project site</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232DD4BF'/%3E%3Cstop offset='1' stop-color='%23A78BFA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='40' font-family='Arial' font-weight='800' font-size='19' text-anchor='middle' fill='%2306122A'%3EPOA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/site.css?v=2">
<script>try { var t = localStorage.getItem('poa-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>

<section id="lock" class="lock" aria-labelledby="lockTitle">
  <div class="lock-glow" aria-hidden="true"></div>
  <form id="lockForm" class="lock-card" autocomplete="on">
    <div class="logo big" aria-hidden="true"><i>POA</i></div>
    <h1 id="lockTitle">Physique Optimization Agent</h1>
    <p class="lock-sub">Private project site</p>
    <input type="text" name="username" value="vince" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button type="submit" id="unlockBtn" class="btn primary wide">Unlock</button>
    <p id="lockMsg" class="lock-msg" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="nav">
    <a class="logo" href="#home" aria-label="POA home"><i>POA</i><span class="logo-text">Physique Optimization Agent</span><span class="logo-short">POA</span></a>
    <nav class="menu" id="menu" aria-label="Main"></nav>
    <div class="nav-right">
      <a class="pill" id="waitPill" href="#waiting"><span class="pill-long">Waiting on Vince</span><span class="pill-short">Waiting</span> <b id="waitCount">0</b></a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark">&#9790;</button>
      <button class="icon-btn burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    </div>
  </header>
  <div class="drop" id="drop" hidden></div>
  <nav class="mobile-menu" id="mobileMenu" aria-label="Menu" hidden></nav>
  <main id="view" class="view" tabindex="-1"></main>
  <footer class="site-foot">
    <span id="builtAt"></span>
    <span class="foot-actions"><button type="button" id="refreshBtn" class="link-btn">Refresh</button><button type="button" id="lockBtn" class="link-btn">Lock site</button></span>
  </footer>
</div>

<div id="zoom" class="zoom" hidden>
  <button type="button" id="zoomClose" class="zoom-close" aria-label="Close">&#10005;</button>
  <div class="zoom-scroll" id="zoomScroll"><img id="zoomImg" alt=""></div>
  <p class="zoom-hint">Tap the diagram to zoom in or out</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" defer></script>
<script src="assets/app.js?v=4" defer></script>
</body>
</html>
