<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdn.jsdelivr.net 'sha256-B2SEKgGwcTxz2DimVvgPf6bM0ZBXlb0ssUEWA/QfYPQ='; style-src 'unsafe-inline'; connect-src https://djkomeqozlulwepehoej.supabase.co; form-action 'none'; base-uri 'none'">
<title>POA sign-in</title>
<!-- POA connector sign-in page (Build Package M3-PK001, task T08; Registry decision D-0095).
     Supabase Auth's OAuth server sends the browser here with an authorization_id when Claude connects
     to POA. The owner signs in, then allows or refuses. Nothing is stored on the device: the session
     lives only in this page. The publishable key below is public by design and opens nothing in POA.
     Second sign-in step (POABUILD-49, 2026-11-14): once the owner has set up an authenticator, the page asks
     for its code before allowing, so Claude's connection carries the second step (the connector needs it).
     Since 2026-11-17 (POABUILD-49, migration 040, connector version 18): Supabase's sign-in server marks Claude's token
     one-step whatever this page did, so after the code and his Allow the page vouches for this request, with the code
     Allow handed back and the owner's own two-step session (poa-connector/trust-claude), before it returns to Claude,
     and POA trusts the one Claude connection that code produces (independent review, 2026-11-19, fix b). Allow and
     Refuse pass skipBrowserRedirect, so the library never goes to Claude on its own: only this page returns there,
     once, after the vouch (readiness architect, test copy, 2026-11-19). -->
<style>
:root { --bg:#f6f6f3; --card:#ffffff; --text:#1d1d1b; --muted:#5d5d58; --line:#d6d6d0; --accent:#1f5f8b; --on-accent:#ffffff; --bad:#a1260d; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161615; --card:#21211f; --text:#ececea; --muted:#a8a8a2; --line:#3a3a37; --accent:#7ab3dc; --on-accent:#0d1b26; --bad:#f39274; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 26rem; margin: 0 auto; padding: 2.5rem 16px; }
h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
p { margin: .5rem 0; }
.muted { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem; margin-top: 1.25rem; }
label { display: block; font-weight: 600; margin: .75rem 0 .25rem; }
input { width: 100%; font: inherit; padding: .65rem .75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
button { width: 100%; font: inherit; font-weight: 600; padding: .7rem 1rem; margin-top: 1rem; border-radius: 8px; border: 1px solid var(--accent); cursor: pointer; }
.primary { background: var(--accent); color: var(--on-accent); }
.secondary { background: transparent; color: var(--accent); }
button:disabled { opacity: .6; cursor: default; }
.error { color: var(--bad); font-weight: 600; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>POA</h1>
  <p class="muted">Sign in to connect Claude to POA. Only the POA owner's account can sign in.</p>

  <section class="card" id="signin" hidden>
    <form id="signin-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>

  <section class="card" id="code" hidden>
    <form id="code-form">
      <label for="code-input">Code from your authenticator app</label>
      <input id="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <button class="primary" type="submit">Continue</button>
    </form>
  </section>

  <section class="card" id="consent" hidden>
    <p><strong id="client-name">Claude</strong> asks to connect to POA.</p>
    <p class="muted">You can remove the connection any time in Claude's connector settings.</p>
    <button class="primary" id="approve" type="button">Allow</button>
    <button class="secondary" id="deny" type="button">Don't allow</button>
  </section>

  <p id="message" class="muted" role="status" aria-live="polite"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script>
"use strict";
const SUPABASE_URL = "https://djkomeqozlulwepehoej.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_AsKogB7gcYgWDzNFwekgUw_FJXobyp0";
const client = supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});
const CONNECTOR = SUPABASE_URL + "/functions/v1/poa-connector";
const authorizationId = new URLSearchParams(location.search).get("authorization_id");
let secondStepDone = false;   // set once his code from the authenticator is accepted
const $ = (id) => document.getElementById(id);

function say(text, bad) {
  $("message").textContent = text;
  $("message").className = bad ? "error" : "muted";
}

function goBack(url) {
  say("Returning to Claude...");
  location.assign(url);
}

// The code Claude gets back, from the return address Supabase hands the page (in its query, or in its fragment)
function codeIn(url) {
  try {
    const u = new URL(url, location.href);
    return u.searchParams.get("code") || new URLSearchParams(u.hash.replace(/^#[^?]*\??/, "")).get("code");
  } catch (e) {
    return null;
  }
}

// Back to Claude. With both steps done, POA is told first which request was allowed, with the code allowing it handed
// back (independent review, 2026-11-19, finding 1, fix b); without that, Claude's connection could do nothing once the
// second step is required, so a refusal stops here and the code is never used.
async function finish(url) {
  if (secondStepDone && !(await vouch(codeIn(url)))) return;
  goBack(url);
}

// POA's own words when a sign-in request can't be used (card POABUILD-49, CR1-D027): the sign-in service answers the
// same way whether the request was already used by someone else (S49-10), used before, or has expired, and the
// right step is the same for each, so the page doesn't try to tell them apart.
const NOT_RECORDED = "POA couldn't record your second step for this connection. Start again from Claude's Connect button, and sign in here only right after pressing it.";
const CANT_USE = "This sign-in request can't be used. Start again from Claude's Connect button, and sign in here only right after pressing it.";

async function showConsent() {
  const { data, error } = await client.auth.oauth.getAuthorizationDetails(authorizationId);
  if (error || !data) return say(secondStepDone ? NOT_RECORDED : CANT_USE, true);
  if (!("authorization_id" in data)) return finish(data.redirect_url); // allowed before: the details call allowed it
  $("client-name").textContent = (data.client && data.client.name) || "An app";
  $("signin").hidden = true;
  $("consent").hidden = false;
  say("");
}

// With both steps done, tell POA which request was just allowed, with its code. Only the answer status "trusted" counts
// (independent review, 2026-11-19, finding 5): an older connector answers this address with an empty OK that records
// nothing.
async function vouch(code) {
  say("Checking...");
  const { data } = await client.auth.getSession();
  const token = data && data.session && data.session.access_token;
  let answer = null;
  try {
    const res = token && code ? await fetch(CONNECTOR + "/trust-claude", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ authorization_id: authorizationId, code }),
    }) : null;
    answer = res ? await res.json().catch(() => null) : null;
  } catch (e) {
    answer = null;
  }
  if (answer && answer.status === "trusted") return true;
  say(NOT_RECORDED, true);
  return false;
}

async function decide(allow) {
  $("approve").disabled = $("deny").disabled = true;
  // skipBrowserRedirect: without it the library itself sends the browser to Claude with the code the moment Allow
  // returns, before the vouch (measured on the test copy, 2026-11-19); only goBack returns to Claude, once.
  const { data, error } = allow
    ? await client.auth.oauth.approveAuthorization(authorizationId, { skipBrowserRedirect: true })
    : await client.auth.oauth.denyAuthorization(authorizationId, { skipBrowserRedirect: true });
  if (error || !data || !data.redirect_url) {
    $("approve").disabled = $("deny").disabled = false;
    // the request used elsewhere between showing Allow and pressing it answers here: with both steps, POA's words
    if (allow && secondStepDone) return say(NOT_RECORDED, true);
    return say((error && error.message) || "That didn't work. Start again from Claude.", true);
  }
  if (allow) return finish(data.redirect_url);
  goBack(data.redirect_url);
}

$("signin-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = event.target.querySelector("button");
  button.disabled = true;
  say("Signing in...");
  const { error } = await client.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("password").value = "";
  button.disabled = false;
  if (error) return say("Sign-in failed: " + error.message, true);
  // stop when the sign-in level can't be read, rather than go on to Allow with no code and no vouch (review finding 5)
  const { data: level, error: levelError } = await client.auth.mfa.getAuthenticatorAssuranceLevel();
  if (levelError || !level || !level.nextLevel) {
    return say("POA couldn't check your sign-in steps. Start again from Claude's Connect button.", true);
  }
  if (level.nextLevel === "aal2" && level.currentLevel !== "aal2") {
    $("signin").hidden = true;
    $("code").hidden = false;
    $("code-input").focus();
    return say("");
  }
  await showConsent();
});
$("code-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = event.target.querySelector("button");
  button.disabled = true;
  say("Checking...");
  const { data, error } = await client.auth.mfa.listFactors();
  const factor = !error && data && (data.totp || [])[0];
  const { error: e2 } = factor
    ? await client.auth.mfa.challengeAndVerify({ factorId: factor.id, code: $("code-input").value.trim() })
    : { error: { message: "no authenticator is set up" } };
  button.disabled = false;
  if (e2) return say("That code didn't work (" + e2.message + "). Type the next code your app shows.", true);
  secondStepDone = true;
  $("code").hidden = true;
  await showConsent();
});
$("approve").addEventListener("click", () => decide(true));
$("deny").addEventListener("click", () => decide(false));

if (!authorizationId) {
  say("Open this page from Claude's Connect button. It needs a sign-in request.", true);
} else {
  $("signin").hidden = false;
  $("email").focus();
}
</script>
</body>
</html>
